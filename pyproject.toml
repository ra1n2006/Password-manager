[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "dan@aa-a.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
password-manager = "password_manager:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
